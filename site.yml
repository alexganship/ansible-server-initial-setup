---
- name: Discover the safe SSH path for every server
  hosts: servers
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - vars/defaults.yml

  pre_tasks:
    - name: Load optional local overrides
      ansible.builtin.include_tasks: tasks/load_local_vars.yml

  tasks:
    - name: Validate controller and connection settings
      ansible.builtin.assert:
        that:
          - managed_user == "support"
          - ssh_port | int >= 1
          - ssh_port | int <= 65535
          - current_ssh_port | int >= 1
          - current_ssh_port | int <= 65535
          - bootstrap_ssh_port | int >= 1
          - bootstrap_ssh_port | int <= 65535
          - controller_private_key_path | length > 0
          - controller_public_key_path | length > 0
          - remote_python_interpreter.startswith("/")
          - (not install_docker | bool) or manage_docker_repository | bool
          - ssh_max_auth_tries | int >= 1
          - fail2ban_maxretry | int >= 1
          - fail2ban_findtime | int >= 1
          - fail2ban_bantime | int >= 1
          - (fail2ban_bantime_maxtime | int) >= (fail2ban_bantime | int)
        fail_msg: >-
          Invalid bootstrap settings. managed_user must be support, SSH ports
          and security limits must be valid, and Docker installation requires
          repository management.

    - name: Resolve controller SSH paths
      ansible.builtin.set_fact:
        controller_private_key_path_expanded: "{{ controller_private_key_path }}"
        controller_public_key_path_expanded: "{{ controller_public_key_path }}"
        controller_known_hosts_file_expanded: "{{ controller_known_hosts_file }}"

    - name: Check the controller private key
      ansible.builtin.stat:
        path: "{{ controller_private_key_path_expanded }}"
      register: controller_private_key

    - name: Check the controller public key
      ansible.builtin.stat:
        path: "{{ controller_public_key_path_expanded }}"
      register: controller_public_key

    - name: Require the shared controller key pair
      ansible.builtin.assert:
        that:
          - controller_private_key.stat.exists
          - controller_private_key.stat.isreg
          - controller_public_key.stat.exists
          - controller_public_key.stat.isreg
        fail_msg: >-
          The shared SSH key pair was not found. Manually install
          {{ controller_public_key_path_expanded }} for root on fresh servers
          before running this playbook.

    - name: Probe support access on managed and current ports
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ controller_private_key_path_expanded }}"
          - -p
          - "{{ item | string }}"
          - -o
          - BatchMode=yes
          - -o
          - "ConnectTimeout={{ ssh_connect_timeout }}"
          - -o
          - "StrictHostKeyChecking={{ ssh_strict_host_key_checking }}"
          - -o
          - "UserKnownHostsFile={{ controller_known_hosts_file_expanded }}"
          - "{{ managed_user }}@{{ ansible_host | default(inventory_hostname) }}"
          - sudo -n /usr/bin/true
      loop: "{{ [ssh_port | int, current_ssh_port | int] }}"
      register: managed_access_probes
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Select a working support port
      ansible.builtin.set_fact:
        discovered_managed_port: >-
          {{
            (
              managed_access_probes.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Probe root key access for a fresh server
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - "{{ controller_private_key_path_expanded }}"
          - -p
          - "{{ bootstrap_ssh_port | string }}"
          - -o
          - BatchMode=yes
          - -o
          - "ConnectTimeout={{ ssh_connect_timeout }}"
          - -o
          - "StrictHostKeyChecking={{ ssh_strict_host_key_checking }}"
          - -o
          - "UserKnownHostsFile={{ controller_known_hosts_file_expanded }}"
          - "root@{{ ansible_host | default(inventory_hostname) }}"
          - /usr/bin/true
      register: root_access_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: discovered_managed_port | string | length == 0

    - name: Stop when neither safe SSH path works
      ansible.builtin.assert:
        that:
          - >-
            discovered_managed_port | string | length > 0
            or (root_access_probe.rc | default(1)) == 0
        fail_msg: >-
          No safe SSH path is available for {{ inventory_hostname }}.
          Expected either {{ managed_user }} with passwordless sudo on port
          {{ ssh_port }} or {{ current_ssh_port }}, or root key access on port
          {{ bootstrap_ssh_port }}. No remote changes were made.

    - name: Record the discovered server state
      ansible.builtin.set_fact:
        bootstrap_state: >-
          {{
            'managed'
            if discovered_managed_port | string | length > 0
            else 'fresh'
          }}
        discovered_ssh_port: >-
          {{
            discovered_managed_port
            if discovered_managed_port | string | length > 0
            else bootstrap_ssh_port
          }}
        ansible_user: >-
          {{
            managed_user
            if discovered_managed_port | string | length > 0
            else 'root'
          }}
        ansible_port: >-
          {{
            discovered_managed_port
            if discovered_managed_port | string | length > 0
            else bootstrap_ssh_port
          }}
        ansible_ssh_private_key_file: "{{ controller_private_key_path_expanded }}"
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking={{ ssh_strict_host_key_checking }}
          -o UserKnownHostsFile={{ controller_known_hosts_file_expanded }}

    - name: Add the server to its execution group
      ansible.builtin.group_by:
        key: "bootstrap_state_{{ bootstrap_state }}"

    - name: Pin the interpreter for subsequent Ubuntu connections
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ remote_python_interpreter }}"


- name: Create and independently verify the support account
  hosts: bootstrap_state_fresh
  serial: 1
  any_errors_fatal: true
  gather_facts: false
  become: false
  vars_files:
    - vars/defaults.yml

  pre_tasks:
    - name: Load optional local overrides
      ansible.builtin.include_tasks: tasks/load_local_vars.yml

  tasks:
    - name: Bootstrap the support account
      ansible.builtin.include_tasks: tasks/bootstrap_support.yml


- name: Converge every server to the managed state
  hosts: bootstrap_state_fresh:bootstrap_state_managed
  serial: 1
  any_errors_fatal: true
  gather_facts: true
  become: true
  vars_files:
    - vars/defaults.yml

  pre_tasks:
    - name: Load optional local overrides
      ansible.builtin.include_tasks: tasks/load_local_vars.yml

    - name: Validate the managed connection and Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Ubuntu"
          - ansible_facts["distribution_release"] == "noble"
          - ansible_user == managed_user
          - ssh_port | int >= 1
          - ssh_port | int <= 65535
        fail_msg: >-
          This playbook supports Ubuntu 24.04 LTS (Noble) nodes reached as
          {{ managed_user }}.

    - name: Verify passwordless sudo through Ansible
      ansible.builtin.command:
        argv:
          - /usr/bin/sudo
          - -n
          - /usr/bin/true
      become: false
      changed_when: false

  tasks:
    - name: Normalize the Docker apt repository before any apt operation
      ansible.builtin.include_tasks: tasks/docker_repository.yml
      when: manage_docker_repository | bool

    - name: Install and configure base system packages
      ansible.builtin.include_tasks: tasks/base_system.yml

    - name: Apply kernel network hardening
      ansible.builtin.include_tasks: tasks/sysctl.yml

    - name: Open the safe SSH migration window
      ansible.builtin.include_tasks: tasks/firewall_transition.yml

    - name: Migrate and harden SSH
      ansible.builtin.include_tasks: tasks/ssh.yml

    - name: Configure optional console-only passwords
      ansible.builtin.include_tasks: tasks/console_passwords.yml
      when: manage_console_passwords | bool

    - name: Finalize the persistent host firewall
      ansible.builtin.include_tasks: tasks/firewall_final.yml

    - name: Configure fail2ban
      ansible.builtin.include_tasks: tasks/fail2ban.yml

    - name: Install and constrain Docker networking
      ansible.builtin.include_tasks: tasks/docker.yml
      when: install_docker | bool or manage_docker_firewall | bool

    - name: Check whether Ubuntu requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Report the final connection and reboot state
      ansible.builtin.debug:
        msg:
          - >-
            Connect: ssh -i {{ controller_private_key_path_expanded }}
            -p {{ ssh_port }} {{ managed_user }}@{{
            ansible_host | default(inventory_hostname) }}
          - >-
            Reboot required: {{ reboot_required.stat.exists | bool }}.
            This playbook never reboots automatically.

  handlers:
    - name: Apply kernel network hardening policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - --system
      changed_when: true

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
