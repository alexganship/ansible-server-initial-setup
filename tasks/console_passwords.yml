---
- name: Validate encrypted console password hashes
  ansible.builtin.assert:
    that:
      - root_console_password_hash | length >= 20
      - support_console_password_hash | length >= 20
      - root_console_password_hash != support_console_password_hash
      - >-
        root_console_password_hash.startswith('$y$')
        or root_console_password_hash.startswith('$6$')
      - >-
        support_console_password_hash.startswith('$y$')
        or support_console_password_hash.startswith('$6$')
    fail_msg: >-
      Console password management requires distinct yescrypt ($y$) or SHA-512
      crypt ($6$) hashes for root and support in an encrypted vars file.

- name: Set and unlock the root console password
  ansible.builtin.user:
    name: root
    password: "{{ root_console_password_hash }}"
    password_lock: false
    update_password: always
  no_log: true

- name: Set and unlock the support console password
  ansible.builtin.user:
    name: "{{ managed_user }}"
    password: "{{ support_console_password_hash }}"
    password_lock: false
    update_password: always
  no_log: true
