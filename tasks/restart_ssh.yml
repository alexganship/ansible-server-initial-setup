---
- name: Detect Ubuntu SSH socket activation
  ansible.builtin.command:
    argv:
      - /usr/bin/systemctl
      - is-active
      - --quiet
      - ssh.socket
  register: ssh_socket_active
  changed_when: false
  failed_when: false

- name: Reload systemd for SSH socket generator changes
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart the active Ubuntu SSH path
  ansible.builtin.systemd:
    name: "{{ 'ssh.socket' if ssh_socket_active.rc == 0 else 'ssh.service' }}"
    state: restarted
