[servers]
# Fresh server after manually installing the controller key for root:
# fresh-1 ansible_host=203.0.113.10

# Already managed server on the configured target SSH port:
# managed-1 ansible_host=203.0.113.11

# Managed server whose old custom port must migrate to the target SSH port:
# old-port-1 ansible_host=203.0.113.12 current_ssh_port=2222

# Do not store passwords or set ansible_user here. The playbook discovers
# support key access or root key access automatically.
